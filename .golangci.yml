# golangci-lint v2 configuration.
#
# v2 is a different schema from v1: `disable-all` and `linters-settings` are
# gone, and `version: "2"` is now required. It is used here because the v1 line
# is built with an older Go than this module targets and exits with "can't load
# config" before linting anything.
#
# The default linter set produced three findings on this codebase that are
# correct by the linter's rules but wrong about intent:
#
#   1. `enableVT is unused` (vt_other.go)
#      False. enableVT() is called from init() in both vt_other.go (!windows)
#      and vt_windows.go. The linter analyses each build-tagged file in
#      isolation, so it cannot see the call from the file it is looking at.
#
#   2. `Error return value of rand.Read is not checked` (wildcard.go)
#      crypto/rand.Read is documented never to return an error. Assigning it
#      to blanks is the correct handling, not a suppression.
#
#   3. `Error return value is not checked` (main.go)
#      The WriteJSONL error is handled - it is written to stderr. errcheck
#      flags the Fprintln result, not the actual error path.
version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
  # gosimple is not listed because v2 folded it into staticcheck. Keeping it
  # here makes the linter exit 3 on an unknown name, before linting anything.

  settings:
    errcheck:
      # check-blank is on, so a bare `_ =` is not enough to silence a call.
      # These four are deliberate and are the only ones listed. Every
      # write-side Close in this repo is checked instead.
      check-blank: true
      exclude-functions:
        # HTTP response bodies, once consumed or once the status is judged.
        - (io.ReadCloser).Close
        # Read-side files: a target list and the output file. The output file's
        # writes are surfaced by the Write calls themselves, which are checked
        # and turn into a non-zero exit rather than a silent empty result.
        - (*os.File).Close
        # crypto/rand.Read is documented never to return an error. Also
        # excluded by path below, belt and braces.
        - crypto/rand.Read
    staticcheck:
      checks: ["all", "-ST1000"]

  exclusions:
    generated: lax
    rules:
      # Build-tag paired files: each file is compiled alone, so cross-file
      # references look unused to the linter.
      - path: vt_other\.go
        linters: [unused]
      - path: vt_windows\.go
        linters: [unused]
      # crypto/rand.Read documents that it never returns an error.
      - path: wildcard\.go
        linters: [errcheck]
        text: "rand.Read"
      # Table tests assert on values and deliberately ignore fixture errors.
      - path: _test\.go
        linters: [errcheck]

formatters:
  enable:
    - gofmt
