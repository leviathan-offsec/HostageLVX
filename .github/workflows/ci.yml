name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Build & test
    runs-on: ${{ matrix.os }}
    strategy:
      # Without this, one matrix leg failing cancels the other five and the
      # summary only ever shows you the first problem. A Windows-only failure
      # should not hide what Linux and macOS did.
      fail-fast: false
      matrix:
        go-version: ['1.23.x', '1.24.x']
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Go mod download
        run: go mod download

      - name: Format gate
        # bash on purpose. windows-latest defaults to PowerShell, which cannot
        # parse "[ -n ... ]" and fails this step with a parser error that looks
        # like a formatting problem and is not one.
        shell: bash
        run: |
          # gofmt is the one check that needs no explanation and no escape
          # hatch. It used to be absent here, which is how twelve files ended
          # up space-indented while CI stayed green.
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::these files are not gofmt-clean:"
            echo "$unformatted"
            echo "run: gofmt -w ."
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        # No "|| echo". That line made this step pass unconditionally, so a
        # failing test and a repo with no tests were indistinguishable in the
        # UI. resolve_test.go exists now; if it breaks, CI should go red.
        run: go test ./... -timeout 60s -race -count=1

      # Every step below goes through `go run` rather than building to a path
      # and invoking it. The old workflow used "/tmp/hostage", which works on
      # Linux and macOS and silently breaks on Windows: PowerShell reads
      # "/tmp/hostage" as a rooted path, drops the leading slash, and looks for
      # D:\a\HostageLVX\HostageLVX. Build and invoke then disagree about where
      # the binary is, and the step dies with "the system cannot find the file
      # specified" while the build above it reported success. `go run` has no
      # path to get wrong, so this cannot drift per-platform again.
      - name: Smoke test, version
        run: go run . -V

      - name: Smoke test, fingerprints
        run: go run . -fingerprints | head -20

      # Proves the resolver accepts what the README tells people to type. It
      # silently failed on every target before, and the only symptom was a
      # per-target "probe failed" that reads like a network problem.
      - name: Smoke test, custom resolver accepts host:port
        run: go run . -dns-server 1.1.1.1:53 -fingerprints | head -5

      # Built separately from the smoke tests, into the workspace rather than
      # /tmp, so the uploaded path is one Windows and POSIX agree on.
      - name: Build upload artifact
        if: matrix.os == 'ubuntu-latest' && matrix.go-version == '1.23.x'
        run: go build -o ./hostage-ci .

      - name: Upload artifact
        if: matrix.os == 'ubuntu-latest' && matrix.go-version == '1.23.x'
        uses: actions/upload-artifact@v4
        with:
          name: hostage-build-${{ github.sha }}
          path: ./hostage-ci
          retention-days: 7

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
      - uses: golangci/golangci-lint-action@v9
        with:
          # Pinned. The v1 line is built with an older Go than this module
          # targets and exits with "can't load config" before linting anything,
          # which is how a red lint job once had nothing to do with the code.
          version: v2.14.0
          args: --timeout 5m
